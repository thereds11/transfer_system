version: '3.8'
services:
  transaction-service:
    build: ../transaction-service
    ports:
      - "8081:8081"
    environment:
      - KAFKA_BROKER=kafka:9092
      - KAFKA_TOPIC=transaction.created
      - FRAUD_TOPIC=transaction.fraud
      - DB_URL=postgres://transferuser:secret@postgres:5432/transferdb?sslmode=disable
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  fraud-service:
    build: ../fraud-service
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ../fraud-service:/app
    environment:
      - KAFKA_BROKER=kafka:9092
      - KAFKA_TOPIC=transaction.created
      - FRAUD_TOPIC=transaction.fraud
      - DB_URL=dbname=transferdb user=transferuser password=secret host=postgres

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: transferuser
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: transferdb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transferuser"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  zookeeper:
    image: bitnami/zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ALLOW_ANONYMOUS_LOGIN: "yes"
    ports:
      - "2181:2181"
    volumes:
      - zk-data:/bitnami/zookeeper

  kafka:
    image: bitnami/kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/9092"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - kafka-data:/bitnami/kafka

  kafka-init:
    image: bitnami/kafka:latest
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ['bash', '-c']
    command: |
      "
      echo -e 'Creating Kafka topic transaction.created...'
      kafka-topics.sh --bootstrap-server kafka:9092 \
        --create --if-not-exists \
        --replication-factor 1 \
        --partitions 1 \
        --topic transaction.created \
      echo -e 'Creating Kafka topic transaction.fraud...'
      kafka-topics.sh --bootstrap-server kafka:9092 \
        --create --if-not-exists \
        --replication-factor 1 \
        --partitions 1 \
        --topic transaction.fraud
      echo -e 'Current Kafka topics:'
      kafka-topics.sh --bootstrap-server kafka:9092 --list
      "

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    depends_on:
      - kafka

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pgadmin.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  pgdata:
  kafka-data:
  zk-data:
